name: Buyer skills
on:
  pull_request:
    paths:
      - 'skills/verdikta-*/**'
      - 'example-bounty-program/**'
      - '.github/workflows/buyer-skills.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    # ubuntu-latest is now ubuntu-26.04, where the locked Playwright 1.59.1 cannot install Chromium. Pin it until Playwright is bumped.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --prefix skills/verdikta-discover
          npm ci --ignore-scripts --prefix skills/verdikta-bounties-onboarding/scripts
          npm ci --ignore-scripts --prefix example-bounty-program/server
          npm ci --ignore-scripts --prefix example-bounty-program/client
          npm ci --ignore-scripts --prefix example-bounty-program/onchain
      - name: Validate discovery package assets, fixtures and scorer self-test
        run: |
          python3 -m venv "$RUNNER_TEMP/validate"
          "$RUNNER_TEMP/validate/bin/pip" install --quiet -r skills/verdikta-discover/tests/requirements.txt
          "$RUNNER_TEMP/validate/bin/python" skills/verdikta-discover/tests/validate_package.py
      - name: Compile ABI and run discovery and transaction tests
        run: |
          npm test --prefix skills/verdikta-bounties-onboarding/scripts
          npm test --prefix skills/verdikta-discover
          node --test example-bounty-program/client/tests/unit/*.test.js
      - name: Server and contracts
        run: |
          npm test --prefix example-bounty-program/server -- --runInBand
          npm run test:offline --prefix example-bounty-program/onchain
      - name: Buyer browser checks and build (no environment files)
        working-directory: example-bounty-program/client
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.buyer.config.js
          node --input-type=module -e "import {build} from 'vite'; await build({envDir:false,mode:'test'});"
