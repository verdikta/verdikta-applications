name: Stake attestation builder
# The reusable environment-image builder of the stake-attestation app (design §8.2, §20 decision 3;
# stake-attestation/README.md, "The reusable builder workflow"). A maker's repository calls it at a
# commit of this repository, and passes the same commit as builder-ref:
#
#   jobs:
#     listing:
#       uses: verdikta/verdikta-applications/.github/workflows/stake-attestation-builder.yml@<commit>
#       with:
#         builder-ref: <commit>
#         spec: listing/code_review.json
#         maker: <the wallet that will send list(), named in the listed commit's .verdikta/stake-control.json>
#         publish-repository: <a repository of your own, readable without a credential>
#       permissions:
#         contents: read
#         packages: write
#
# That is the route for a dev-signed listing. A listing that is to be signed in production has its image under
# ghcr.io/verdikta, in ghcr.io/verdikta/stake-env, pushed by this workflow as a job of Verdikta's own caller (owner
# decision Q42; builder/caller/stake-attestation-site-build.yml). Arbiters' default registry allowlist holds that
# namespace and nothing else, so a dev listing published elsewhere is for arbiters set up to take it.
#
# Four jobs. source runs nothing of the maker's: it opens the site's request, checking the maker's wallet signed it, or
# checks out the draft from the calling repository, and hands the build only those files. build runs the maker's
# setup and holds no secret and no token scope (permissions: {}): the pinned code-runner reads the
# commands before anything is fetched, the image goes to a registry:2 on the runner's loopback and
# is validated by that code-runner there; the image (skopeo's dir
# layout) and the output folder leave as artifacts, with their digests as job outputs. publish
# runs none of the maker's code: it checks the layout against the digest and copies it byte for
# byte to publish-repository, which must be readable without a credential, as arbiters pull it.
# sign receives only the build's outputs: it checks them against the build job's digest, the
# report and the published image, then signs attestation.json with a key made for the run. The
# baseline scan is not run here: its findings are the maker's, and this workflow's logs and
# artifacts can be public.
#
# With build-only, the build job validates the listing as it always does, prints the image build's log, and stops
# there: the image stays on the runner's loopback registry, publish and sign are skipped, and outputs-sha256 is
# empty, so the signing workflow refuses the run (its first step, before --check-registry would find no published
# image). This repository's CI runs the workflow that way on a seed listing (stake-attestation.yml, builder-dry-run).
#
# This file can't reach the production key: no job here can mint a cloud identity and it reads no
# secret, so a caller grants it nothing beyond the above. With signing: production it builds and
# publishes for production and stops; stake-attestation-builder-sign.yml signs, as the next job of
# Verdikta's own caller (stake-attestation/docs/builder-kms-signing.md). GitHub checks a called job's
# id-token permission against the caller before anything runs, whatever the job's condition, which is
# why that job has a file of its own: in this file, every maker would have to grant it.
#
# It has no trigger of its own, and the only call in this repository is that dry run, which publishes nothing:
# publishing an image in Verdikta's own registry namespace is owner gate G1.
on:
  workflow_call:
    inputs:
      builder-ref:
        description: The verdikta-applications commit this workflow is called at; the builder runs from there.
        required: true
        type: string
      spec:
        description: Path, in the calling repository, of the maker's draft code_review.json. Empty with site-request.
        required: false
        type: string
        default: ''
      site-request:
        description: The listing request the maker's wallet signed, as base64 of gzip, in place of spec, known-issues and deployment-proof (Verdikta's caller; builder/action/site-request.js).
        required: false
        type: string
        default: ''
      site-auth:
        description: With site-request, the wallet's signature and its challenge's fields, as base64.
        required: false
        type: string
        default: ''
      site-explorers:
        description: With site-request, a JSON object from chain id to a keyless explorer API. The source job picks by the chain the signed request names, so no input can choose it.
        required: false
        type: string
        default: ''
      known-issues:
        description: Path, in the calling repository, of known_issues.json, when the draft names one.
        required: false
        type: string
        default: ''
      maker:
        description: The wallet that will send list(). The repository's .verdikta/stake-control.json at the listed commit must name this address, or the build refuses the listing (stake-attestation/docs/control-proof.md).
        required: true
        type: string
      deployment-proof:
        description: For a contract listing, the path, in the calling repository, of its deployer's or owner's signature, JSON { signer, signature, creationTx?, stakeChainId, stakeContract }.
        required: false
        type: string
        default: ''
      publish-repository:
        description: Where the env image is published for arbiters. It must be readable without a credential. A listing signed in production has its image in ghcr.io/verdikta/stake-env.
        required: true
        type: string
      runtime:
        description: The code-runner's runtime, runsc (gVisor, which a production key requires) or runc.
        required: false
        type: string
        default: runsc
      explorer-api-url:
        description: For a contract listing, a keyless explorer API in the Etherscan shape for its chain (Blockscout's, say); the build job holds no key.
        required: false
        type: string
        default: ''
      signing:
        description: dev (a key made for the run, accepted only under dev trust) or production (no signature here; stake-attestation-builder-sign.yml signs with the KMS key, as the caller's next job).
        required: false
        type: string
        default: dev
      artifact-name:
        description: The prefix of this invocation's artifact names (letters, digits, . _ -). By default one derived from spec, known-issues and publish-repository, so a caller that runs the workflow for several listings in one run gets distinct artifacts; set it when one run builds the same listing twice.
        required: false
        type: string
        default: ''
      build-only:
        description: true builds and validates the listing, prints the image build's log, and stops there. The image stays on the runner's loopback registry and is not uploaded, publish and sign are skipped, and outputs-sha256 is empty, so nothing can sign the build. False by default.
        required: false
        type: boolean
        default: false
    outputs:
      image:
        description: The env image, by digest, as code_review.json names it.
        value: ${{ jobs.build.outputs.image }}
      signed-artifact:
        description: The artifact holding the signed listing files. With signing production, stake-attestation-builder-sign.yml uploads it.
        value: ${{ format('{0}-listing-signed', jobs.build.outputs.artifact-id) }}
      artifact-id:
        description: The prefix of this invocation's artifact names, for stake-attestation-builder-sign.yml.
        value: ${{ jobs.build.outputs.artifact-id }}
      outputs-sha256:
        description: The digest of the output folder, which stake-attestation-builder-sign.yml checks before it signs. Empty unless signing is production (and build-only is off), so a listing that skipped production's checks at the build, or was never published, can't be handed on to be signed.
        value: ${{ inputs.signing == 'production' && !inputs.build-only && jobs.build.outputs.outputs-sha256 || '' }}

permissions: {}

jobs:
  source:
    name: Read the draft (runs nothing of the maker's)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.names.outputs.id }}
      spec: ${{ steps.site.outputs.spec || inputs.spec }}
      known-issues: ${{ steps.site.outputs.known-issues || inputs.known-issues }}
      deployment-proof: ${{ steps.site.outputs.deployment-proof || inputs.deployment-proof }}
      explorer-api-url: ${{ steps.site.outputs.explorer-api-url || inputs.explorer-api-url }}
    steps:
      - name: One source for the draft
        env:
          SPEC: ${{ inputs.spec }}
          SITE_REQUEST: ${{ inputs.site-request }}
        run: |
          if [ -z "$SPEC" ] && [ -z "$SITE_REQUEST" ]; then echo "::error::give spec, a path in the calling repository"; exit 1; fi
          if [ -n "$SPEC" ] && [ -n "$SITE_REQUEST" ]; then echo "::error::give spec or site-request, not both"; exit 1; fi
      - name: Artifact names for this invocation (artifacts share the calling run's namespace)
        id: names
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          SPEC: ${{ inputs.spec }}
          KNOWN_ISSUES: ${{ inputs.known-issues }}
          PUBLISH_REPOSITORY: ${{ inputs.publish-repository }}
        run: |
          set -euo pipefail
          if [ -n "$ARTIFACT_NAME" ]; then
            if ! printf '%s' "$ARTIFACT_NAME" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'; then echo "::error::artifact-name must be 1-64 letters, digits, . _ or -"; exit 1; fi
            id="$ARTIFACT_NAME"
          else
            id="vab-$(printf '%s\n%s\n%s' "$SPEC" "$KNOWN_ISSUES" "$PUBLISH_REPOSITORY" | sha256sum | cut -c1-16)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Check out the builder, for a site's request
        if: inputs.site-request != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: verdikta/verdikta-applications
          ref: ${{ inputs.builder-ref }}
          path: verdikta-builder
          persist-credentials: false
      - if: inputs.site-request != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install the builder's locked dependencies without lifecycle scripts
        if: inputs.site-request != ''
        run: npm ci --ignore-scripts --prefix verdikta-builder/stake-attestation/builder
      - name: Open the site's request (the maker's wallet signed it, or nothing goes on)
        id: site
        if: inputs.site-request != ''
        env:
          SITE_REQUEST: ${{ inputs.site-request }}
          SITE_AUTH: ${{ inputs.site-auth }}
          SITE_EXPLORERS: ${{ inputs.site-explorers }}
          MAKER: ${{ inputs.maker }}
        run: node verdikta-builder/stake-attestation/builder/action/site-request.js unpack --out listing-source
      - name: Check out the draft and its known issues (the builder fetches the listed commit itself)
        if: inputs.site-request == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: listing-source
          persist-credentials: false
          sparse-checkout: |
            ${{ inputs.spec }}
            ${{ inputs.known-issues }}
            ${{ inputs.deployment-proof }}
          sparse-checkout-cone-mode: false
      - name: Keep only the draft's files
        if: inputs.site-request == ''
        run: rm -rf listing-source/.git
      - name: Hand them to the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.names.outputs.id }}-source
          path: listing-source
          if-no-files-found: error
          include-hidden-files: true

  build:
    name: Build and validate (no secrets, no token scope)
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: {}
    outputs:
      image: ${{ steps.build.outputs.image }}
      outputs-sha256: ${{ steps.digest.outputs.sha256 }}
      artifact-id: ${{ needs.source.outputs.artifact-id }}
    steps:
      - name: Paths
        run: |
          {
            echo "VAB_WORK=$RUNNER_TEMP/vab"
            echo "VAB_OUT=$RUNNER_TEMP/vab-out"
            echo "VAB_IMAGE=$RUNNER_TEMP/vab-image"
            echo "VAB_BUILDER=$GITHUB_WORKSPACE/verdikta-builder/stake-attestation/builder"
          } >> "$GITHUB_ENV"
      - name: Check out the builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: verdikta/verdikta-applications
          ref: ${{ inputs.builder-ref }}
          path: verdikta-builder
          persist-credentials: false
      - name: The draft and its known issues, as the source job left them (the builder fetches the listed commit itself)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.source.outputs.artifact-id }}-source
          path: listing-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install the builder's locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix "$VAB_BUILDER"
      - name: Keep the build's containers off the host's metadata services
        # The maker's setup runs with network: it must reach nothing private from this runner, and it needs DNS,
        # whose resolver here is on one of those addresses (action/egress-rules.sh says which ports stay open, and why).
        run: sudo bash "$VAB_BUILDER/action/egress-rules.sh"
      - name: Install gVisor (pinned, SHA-512 checked, systrap platform)
        if: inputs.runtime == 'runsc'
        run: |
          set -euo pipefail
          version=$(jq -r .gvisor.version "$VAB_BUILDER/action/pins.json")
          sha512=$(jq -r .gvisor.sha512 "$VAB_BUILDER/action/pins.json")
          curl -fsSL -o "$RUNNER_TEMP/gvisor.tar.bz2" "https://storage.googleapis.com/gvisor/releases/release/${version}/x86_64/gvisor.tar.bz2"
          echo "${sha512}  $RUNNER_TEMP/gvisor.tar.bz2" | sha512sum -c -
          dest="/opt/gvisor/${version}"
          sudo mkdir -p "$dest" /var/lib/code-runner-scratch
          sudo tar -xjf "$RUNNER_TEMP/gvisor.tar.bz2" -C "$dest"
          cfg=/etc/docker/daemon.json
          current='{}'
          if [ -s "$cfg" ]; then current=$(sudo cat "$cfg"); fi
          echo "$current" | jq --arg path "$dest/runsc" \
            '.runtimes.runsc = {path: $path, runtimeArgs: ["--platform=systrap", "--overlay2=root:dir=/var/lib/code-runner-scratch,size=4g"]}' \
            | sudo tee "$cfg" > /dev/null
          sudo systemctl reload docker
          for _ in $(seq 1 20); do
            docker info --format '{{json .Runtimes}}' | jq -e '.runsc' > /dev/null && break
            sleep 1
          done
          docker info --format '{{json .Runtimes}}' | jq -e '.runsc' > /dev/null
      - name: Start registry:2 and the code-runner on the runner's loopback
        env:
          PUBLISH_REPOSITORY: ${{ inputs.publish-repository }}
          RUNTIME: ${{ inputs.runtime }}
          SIGNING: ${{ inputs.signing }}
          SPEC: ${{ needs.source.outputs.spec }}
          EXPLORER_API_URL: ${{ needs.source.outputs.explorer-api-url }}
        run: node "$VAB_BUILDER/action/services.js" start --dir "$VAB_WORK" --publish-as "$PUBLISH_REPOSITORY" --spec "listing-source/$SPEC" --runtime "$RUNTIME" --signing "$SIGNING" --explorer-url "$EXPLORER_API_URL"
      - name: Build, push to the loopback registry and validate
        id: build
        env:
          SPEC: ${{ needs.source.outputs.spec }}
          KNOWN_ISSUES: ${{ needs.source.outputs.known-issues }}
          MAKER: ${{ inputs.maker }}
          DEPLOYMENT_PROOF: ${{ needs.source.outputs.deployment-proof }}
        run: |
          set -euo pipefail
          known=()
          if [ -n "$KNOWN_ISSUES" ]; then known=(--known-issues "listing-source/$KNOWN_ISSUES"); fi
          proof=()
          if [ -n "$DEPLOYMENT_PROOF" ]; then proof=(--control-proof "listing-source/$DEPLOYMENT_PROOF"); fi
          node "$VAB_BUILDER/bin/verdikta-build-env.js" build --config "$VAB_WORK/builder.json" --spec "listing-source/$SPEC" "${known[@]}" "${proof[@]}" --maker "$MAKER" --out "$VAB_OUT"
          echo "image=$(jq -r .env.image "$VAB_OUT/code_review.json")" >> "$GITHUB_OUTPUT"
      - name: The image build's log, the setup's output included, from the daemon's build history (build-only runs only)
        if: ${{ !cancelled() && inputs.build-only }}
        env:
          BUILDX_EXPERIMENTAL: '1'
        # The setup's output is the maker's text: the runner reads no workflow command in it.
        run: |
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          rc=0
          docker buildx history logs || rc=$?
          echo "::$token::"
          if [ "$rc" -ne 0 ]; then echo "::warning::the daemon's build history holds no log to show ($rc)"; fi
      - name: Export the validated image, byte for byte (skopeo's dir layout keeps any manifest type)
        run: node "$VAB_BUILDER/action/image.js" export --from "$(jq -r .image.stagedRef "$VAB_OUT/validation-report.json")" --dir "$VAB_IMAGE"
      - name: Digest of the output folder, for the sign job
        id: digest
        run: echo "sha256=$(node "$VAB_BUILDER/bin/verdikta-build-env.js" digest --dir "$VAB_OUT")" >> "$GITHUB_OUTPUT"
      - name: Upload the output folder (the listing's files and the validation report)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.source.outputs.artifact-id }}-listing
          path: ${{ env.VAB_OUT }}
          if-no-files-found: ignore
          # A listing may name its files with a leading dot (.attestation.json, say).
          include-hidden-files: true
      - name: Upload the image
        if: ${{ !inputs.build-only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.source.outputs.artifact-id }}-env-image
          path: ${{ env.VAB_IMAGE }}
          if-no-files-found: error
          include-hidden-files: true
      - name: Stop the services
        if: always()
        run: node "$VAB_BUILDER/action/services.js" stop --dir "$VAB_WORK"

  publish:
    name: Publish the env image
    needs: build
    if: ${{ !inputs.build-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Paths
        run: |
          {
            echo "VAB_IMAGE=$RUNNER_TEMP/vab-image"
            echo "VAB_BUILDER=$GITHUB_WORKSPACE/verdikta-builder/stake-attestation/builder"
          } >> "$GITHUB_ENV"
      - name: Check out the builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: verdikta/verdikta-applications
          ref: ${{ inputs.builder-ref }}
          path: verdikta-builder
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Download the image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact-id }}-env-image
          path: ${{ env.VAB_IMAGE }}
      - name: Check the layout against the digest code_review.json names, push it byte for byte, read it back without a credential
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          PUBLISH_REPOSITORY: ${{ inputs.publish-repository }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: node "$VAB_BUILDER/action/image.js" publish --dir "$VAB_IMAGE" --image "$IMAGE" --to "$PUBLISH_REPOSITORY"

  sign:
    name: Sign attestation.json
    needs: [build, publish]
    if: inputs.signing != 'production' && !inputs.build-only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Paths
        run: |
          {
            echo "VAB_WORK=$RUNNER_TEMP/vab"
            echo "VAB_OUT=$RUNNER_TEMP/vab-out"
            echo "VAB_BUILDER=$GITHUB_WORKSPACE/verdikta-builder/stake-attestation/builder"
          } >> "$GITHUB_ENV"
      - name: Check out the builder (never the calling repository)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: verdikta/verdikta-applications
          ref: ${{ inputs.builder-ref }}
          path: verdikta-builder
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install the builder's locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix "$VAB_BUILDER"
      - name: Download the build's outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact-id }}-listing
          path: ${{ env.VAB_OUT }}
      - name: The signing config
        env:
          PUBLISH_REPOSITORY: ${{ inputs.publish-repository }}
        run: node "$VAB_BUILDER/action/services.js" sign-config --dir "$VAB_WORK" --signing dev --publish-as "$PUBLISH_REPOSITORY"
      - name: Check the build's outputs and the published image, then sign
        env:
          OUTPUTS_SHA256: ${{ needs.build.outputs.outputs-sha256 }}
          MAKER: ${{ inputs.maker }}
        run: node "$VAB_BUILDER/bin/verdikta-build-env.js" sign --config "$VAB_WORK/sign.json" --dir "$VAB_OUT" --maker "$MAKER" --expect-outputs "$OUTPUTS_SHA256" --check-registry
      - name: Upload the signed listing files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.build.outputs.artifact-id }}-listing-signed
          path: ${{ env.VAB_OUT }}
          if-no-files-found: error
          include-hidden-files: true
