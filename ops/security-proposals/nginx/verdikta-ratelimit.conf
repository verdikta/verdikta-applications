# PROPOSED (security review, not installed): /etc/nginx/conf.d/verdikta-ratelimit.conf
# conf.d is included at http{} scope by nginx.conf, which is where limit_*_zone must live.
#
# No verdikta site has any request rate limit today. Every API below fans out to paid RPC or IPFS
# calls (arbiters /api/arbiters/owned: ~3 RPC calls per registered arbiter per request; the
# playground's /api/upload pins to Pinata and /api/fetch proxies any CID), so one client can burn the
# shared Infura/Pinata quota for production and the test sites alike.
#
# $binary_remote_addr is the TCP peer: correct here because nginx is the edge (no CDN in front).
# Do NOT key on X-Forwarded-For, which any client can set.

server_tokens off;   # nginx.conf has "server_tokens build", which discloses the exact build

limit_req_zone  $binary_remote_addr zone=verdikta_api:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=verdikta_heavy:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=verdikta_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Usage, in each verdikta server block (see the *.proposed files next to this one):
#   location /api/                  { limit_req zone=verdikta_api burst=40 nodelay; limit_conn verdikta_conn 20; ... }
#   location = /api/arbiters/owned  { limit_req zone=verdikta_heavy burst=10 nodelay; ... }
#   location = /api/upload          { limit_req zone=verdikta_heavy burst=5;  client_max_body_size 20m; ... }
