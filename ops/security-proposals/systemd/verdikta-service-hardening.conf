# PROPOSED drop-in (security review, not installed) for every verdikta-*.service, e.g.
#   /etc/systemd/system/verdikta-arbiters-server.service.d/hardening.conf
#   /etc/systemd/system/verdikta-test-arbiters-server.service.d/hardening.conf
#
# Today every unit runs as root with no sandbox, and the node servers listen on all interfaces with
# the host firewall off. An RCE in any of them (including the TEST servers, which run less-reviewed
# beacon code deployed from origin) is root on the production box: production secrets, the live
# checkout, nginx and the certificates.
#
# Step 1 (no code moves needed, safe to apply now): sandbox while still root.
[Service]
Environment=HOST=127.0.0.1
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=
UMask=0077
# Writable paths: the app's own data/tmp/log locations only. Adjust per unit, e.g. for the
# production arbiters server:
ReadWritePaths=/root/verdikta/applications/example-arbiters/server/data
# and for a TEST unit, hide production entirely:
#   InaccessiblePaths=/root/verdikta/applications /root/verdikta/secrets /etc/letsencrypt
#   ReadWritePaths=/root/verdikta/applications-test/example-arbiters/server/data /tmp/verdikta-test

# Step 2 (needs the checkouts readable by another user): a dedicated user per site, e.g.
#   useradd --system --home /srv/verdikta --shell /usr/sbin/nologin verdikta-test
#   User=verdikta-test
#   Group=verdikta-test
# with the test checkout and /root/verdikta/secrets-test owned by it, and no access to
# /root/verdikta/secrets or the live checkout.
#
# Secrets: Environment= lines are readable by any local user through `systemctl show`. Put keys in
# an EnvironmentFile= (mode 0600) or LoadCredential= instead. The bounty-base override.conf holds an
# API key in an Environment= line today.
