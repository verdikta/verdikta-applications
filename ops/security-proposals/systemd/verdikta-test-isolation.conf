# PROPOSED drop-in (round-2 security review, compromise direction; not installed) for the three TEST units:
#   /etc/systemd/system/verdikta-test-bounty-testnet.service.d/isolation.conf
#   /etc/systemd/system/verdikta-test-bounty-base.service.d/isolation.conf
#   /etc/systemd/system/verdikta-test-arbiters-server.service.d/isolation.conf
# Apply on top of verdikta-service-hardening.conf (same directory). Install before the test units are first
# enabled: none is installed today.
#
# Why. The test sites run origin/beacon, which anyone with push access to verdikta-applications can move, and
# deploy.sh puts it on this machine as root. Without this file a bug or a hostile commit in a TEST server is
# root on the production machine. From there, measured on the host (2026-11-25, modes only, no secret read):
#   - /root/verdikta/secrets/.env.secrets (0600 root): every production key, including, by the Hardhat configs,
#     PRIVATE_KEY / PRIVATE_KEY_2, the deployer and so the owner of the aggregator and keeper
#   - /root/verdikta/applications: the live checkout. Three production units run `vite build --watch` in it
#     (verdikta-arbiters-client, verdikta-bounty-client-base, verdikta-bounty-client-testnet), so a file written
#     under a client's src/ is rebuilt and served to every visitor of bounties.verdikta.org within seconds: a
#     wallet-draining page with no deploy step and no log line beyond the watcher's.
#   - /root/.ssh/id_ed25519: the key every checkout here fetches with (git@github.com, one key for
#     verdikta-applications, -arbiter, -common and -dispatcher). deploy.sh fetches with it non-interactively, so
#     it is usable without a passphrase. If it has push rights, the attacker pushes to beacon/main of every repo.
#   - /etc/letsencrypt (every site's private keys), /root/websites (the alvamuseum sites and their .env),
#     /var/run/docker.sock (root again, even after User= is set).
# None of those is needed by a test server. The servers start no subprocess and run no git.
[Service]
InaccessiblePaths=/root/verdikta/secrets /root/.ssh /etc/letsencrypt /root/websites /var/run/docker.sock /run/docker.sock
InaccessiblePaths=-/root/verdikta/applications/example-bounty-program -/root/verdikta/applications/example-arbiters -/root/verdikta/applications/example-frontend -/root/verdikta/applications/example-agents
InaccessiblePaths=-/root/verdikta/dispatcher -/root/verdikta/arbiter -/root/verdikta/common -/root/verdikta/applications-beacon
# The test checkout's git data lives in the live checkout's .git (it is a worktree of it); a server must not
# write hooks or config there, which the live checkout would run.
ReadOnlyPaths=/root/verdikta/applications/.git
# Only the test servers' own data and tmp are writable.
ReadWritePaths=/root/verdikta/applications-test/example-bounty-program/server/data /root/verdikta/applications-test/example-arbiters/server/data /tmp/verdikta-test
ReadWritePaths=/root/verdikta/applications-test/example-bounty-program/server /root/verdikta/applications-test/example-arbiters/server
# (the second line covers the append: log files the units write; narrow it to the log files once they move to
# /var/log/verdikta-test/)
#
# Check after installing: systemd-analyze security verdikta-test-bounty-testnet, and
#   nsenter -t $(systemctl show -p MainPID --value verdikta-test-bounty-testnet) -m ls /root/verdikta/secrets
# must fail with "Permission denied".
#
# The same InaccessiblePaths lines (without the test checkout) belong on the production web units too: no
# production server reads /root/.ssh, /etc/letsencrypt, /root/websites or the docker socket either.
