# The site's response headers: the one file for them (node P23; stake-attestation/README.md, "Running the site").
# Install as /etc/nginx/snippets/verifiers.verdikta.org-headers.conf. The site config includes it once, in its
# HTTPS server, and has no add_header of its own: nginx drops every inherited add_header in a block that sets one.
# The client's CSP test (client/playwright.csp.config.js) serves the built client with exactly these headers and
# runs its Playwright flows under them, so a change here is a change that test sees. `always`: on every answer,
# a 404, a 413 or a 429 too.
#
# Content-Security-Policy: what the built client loads and connects to, and nothing else.
#   default-src 'none'   anything not named below is refused
#   script-src 'self'    the build's own module scripts; index.html has no inline script, so no hash or nonce
#   style-src 'self'     the build's one stylesheet; React sets styles through the DOM, which the policy allows
#   img-src 'self'       the badge, from /api on this origin
#   connect-src          /api on this origin; the chain reads at VITE_SA_RPC_URL and the disclosed ciphertexts at
#                        each gateway of VITE_IPFS_GATEWAY, in its order, by origin, as deploy/client.env builds them
#                        (a test holds the two files to each other). A browser wallet's own traffic leaves from the
#                        extension, not the page.
#   form-action 'none'   the site has no form that posts; base-uri 'none', object-src 'none'
#   frame-ancestors 'none'  no page may frame the site
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://sepolia.base.org https://gateway.pinata.cloud https://ipfs.io; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;

# One year, this name only (no includeSubDomains: the domain's other names are not the site's), and no preload.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;

# The page already says no-referrer (index.html); the header says it for every answer.
add_header Referrer-Policy "no-referrer" always;

# Nothing the site does needs any of these.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
