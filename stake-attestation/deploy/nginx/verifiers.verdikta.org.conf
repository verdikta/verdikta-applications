# https://verifiers.verdikta.org: the stake attestation site (node P23; stake-attestation/README.md, "Running the
# site"). Install as /etc/nginx/sites-available/verifiers.verdikta.org, linked from /etc/nginx/sites-enabled/, with the
# headers file at /etc/nginx/snippets/verifiers.verdikta.org-headers.conf. Debian and Ubuntu read sites-enabled/*
# inside the http block, so the map and the zones below are http-level. CI runs `nginx -t` on this file as installed,
# with a throwaway certificate at certbot's paths, and then nginx itself in front of a stub server
# (shared/test/deploy/nginxLive.test.js).
#
# Rate limits, per client address. The server keys nothing on a client's address, so it needs no trusted-proxy
# setting; nginx sees the address itself as long as nothing sits in front of it (README: a CDN in front needs
# set_real_ip_from, or every client shares the CDN's addresses). Each value and why: README, "The rate limits".
#
#   verifiers_api    every request under /api: 5 a second, a burst of 30. The client's fastest call of its own is its
#                    poll of a listing being built, GET /api/listings/:id every 500 ms at first, backing off to 5 s
#                    (client/src/lib/api.js); a page load makes 2 or 3 calls at once. So one tab never uses half.
#   verifiers_work   every POST under /api, 12 a minute, a burst of 12. Each one starts work or takes a wallet
#                    sign-in challenge: the listing request's challenge and the request itself, a scan's or a dispute
#                    statement's challenge and their answers, a statement's pin, a contract's proof check (four at a
#                    time on the server), a deployment message. A maker's whole session is fewer than 12.
#   verifiers_build  POST /api/listings, which starts a build in Verdikta's signing workflow: 2 a minute, a burst of
#                    2. The server's own build budget (3 a wallet, 20 in all a day) still decides how many run.
#
# Every /api location takes all three; a request is counted in a zone only when its key is not empty.
limit_req_zone $binary_remote_addr zone=verifiers_api:10m rate=5r/s;

map $request_method $verifiers_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $verifiers_post_key zone=verifiers_work:10m rate=12r/m;

# The listing submission in every spelling the server routes to it. Express matches a path case-insensitively, with
# or without one trailing slash, so POST /api/listings/ and POST /api/LISTINGS submit a listing too. $uri is the path
# nginx decoded and normalized (slashes merged, dot segments resolved), so it reads each of those as one of these.
map "$request_method $uri" $verifiers_build_key {
    "~*^POST /api/listings/?$"  $binary_remote_addr;
    default                     "";
}
limit_req_zone $verifiers_build_key zone=verifiers_build:10m rate=2r/m;

# The server: src/index.js, on loopback (deploy/server.env.example: HOST, PORT).
upstream verifiers_server {
    server 127.0.0.1:5009;
    keepalive 16;
}

# Anything addressed to another name, or to the host's address: nothing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name verifiers.verdikta.org;
    server_tokens off;

    # certbot's HTTP challenge, from the webroot the certificate was issued with (README, "The certificate")
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://verifiers.verdikta.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name verifiers.verdikta.org;
    server_tokens off;

    # certbot certonly --webroot writes these, and its renewal replaces them in place
    ssl_certificate /etc/letsencrypt/live/verifiers.verdikta.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verifiers.verdikta.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:verifiers_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The CSP and the other headers, for every location below. No add_header anywhere in this file.
    include /etc/nginx/snippets/verifiers.verdikta.org-headers.conf;

    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 30s;
    # Pages and assets take no body; each /api location sets its own.
    client_max_body_size 16k;

    limit_req_status 429;
    limit_req_log_level warn;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # The client's production build (client/dist), copied here at each release. Its routes are in the URL's hash, so
    # the only page is index.html.
    root /var/www/verifiers.verdikta.org;
    index index.html;

    location = /index.html {
        # no-cache: a new build's asset names reach the next page load
        expires -1;
    }

    location /assets/ {
        # Vite names each file by its content hash
        expires max;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The API. proxy_* here are the server-level ones below; the server sends its own Cache-Control.
    location /api/ {
        limit_req zone=verifiers_api burst=30 nodelay;
        limit_req zone=verifiers_work burst=12 nodelay;
        limit_req zone=verifiers_build burst=2 nodelay;
        # the largest body any other route takes is a dispute statement's 32 KB: the server answers its own 413 up to
        # this, nginx past it
        client_max_body_size 64k;
        proxy_pass http://verifiers_server;
    }

    # A draft listing (its code_review.json, known issues and invited hunters), to the submission and to its
    # challenge, in every spelling the server routes (case-insensitive, an optional trailing slash): the server takes
    # 1 MB and answers its own 413 above that; nginx stops anything over 2 MB before it reaches Node.
    location ~* ^/api/listings(?:/challenge)?/?$ {
        limit_req zone=verifiers_api burst=30 nodelay;
        limit_req zone=verifiers_work burst=12 nodelay;
        limit_req zone=verifiers_build burst=2 nodelay;
        client_max_body_size 2m;
        proxy_pass http://verifiers_server;
    }

    # To the server. It reads neither forwarded header today (no trust proxy); they are for its log, if it ever keeps one.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A request is read whole before it is sent on, so a slow client holds nginx, not Node.
    proxy_request_buffering on;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    # The slowest answer: a dispute statement, read on-chain and then pinned (SA_PIN_TIMEOUT_MS, 60 s); a long record
    # read in recordPage pages comes next.
    proxy_read_timeout 120s;
}
