# Rootless Docker for the site's service user (node P23; stake-attestation/README.md, "Running the site"). Install as
# /etc/systemd/system/user@.service.d/delegate.conf, then `systemctl daemon-reload` and restart the user's manager.
# systemd then delegates these cgroup v2 controllers to each user's manager, so the user's dockerd can apply the
# baseline scan's --cpus, --memory and --pids-limit (builder/src/docker.js). Without cpu, memory and pids it drops
# those limits with a warning and runs the scan unbounded; deploy/check-scan-limits.mjs says which.
# Docker's rootless documentation gives this line.
[Service]
Delegate=cpu cpuset io memory pids
